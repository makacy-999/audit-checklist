<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>审计应对 Check list</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --bd:#e4e8ee; --bd2:#eef1f5;
  --ink:#14202e; --ink2:#4b5a6b; --ink3:#8a96a6;
  --pri:#145388; --pri-bg:#eaf1f8; --pri-bd:#c7dcee;
  --ok:#0f7a58;  --ok-bg:#e6f4ee;  --ok-bd:#bfe3d4;
  --warn:#a86a06;--warn-bg:#fdf4e3;--warn-bd:#f0dcae;
  --idle:#78849a;--idle-bg:#f1f3f6;--idle-bd:#dfe3ea;
  --na:#5566c9;  --na-bg:#edeffb;  --na-bd:#ccd3f4;
  --red:#c0392b; --red-bg:#fdeeec; --red-bd:#f3cdc7;
  --lock:#b9a06a; --lock-bg:#fbf7ea;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}

/* ══ header ══ */
header{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:60;
  box-shadow:0 1px 3px rgba(20,40,70,.05)}
.hd{max-width:1460px;margin:0 auto;padding:11px 22px 0}
.hd-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand .meta{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstrip{display:flex;align-items:center;gap:10px;margin-left:auto}
.pstrip .bar{width:150px;height:7px;background:var(--bd2);border-radius:99px;overflow:hidden;display:flex}
.pstrip .bar i{height:100%;display:block}
.pstrip .tx{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pstrip .tx b{color:var(--pri);font-size:13.5px}
.hd-act{display:flex;gap:7px}

.btn{border:1px solid var(--bd);background:#fff;color:var(--ink2);border-radius:6px;
  padding:6px 11px;font:12.5px/1.4 inherit;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:#0f4370;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.dgr:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}

/* identity chip */
.idchip{display:flex;align-items:center;gap:7px;border:1px solid var(--pri-bd);background:var(--pri-bg);
  border-radius:7px;padding:4px 6px 4px 10px;white-space:nowrap}
.idchip .av{width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;
  font:700 11px/22px var(--mono);text-align:center;flex:none}
.idchip .nm{font-size:12.5px;font-weight:600;color:var(--pri)}
.idchip.admin{border-color:var(--warn-bd);background:var(--warn-bg)}
.idchip.admin .av{background:var(--warn)}
.idchip.admin .nm{color:var(--warn)}
.idchip .sw{border:none;background:transparent;color:var(--ink3);cursor:pointer;font:12px/1 inherit;padding:3px 5px;border-radius:4px}
.idchip .sw:hover{background:rgba(0,0,0,.06);color:var(--ink)}

.tabs{display:flex;gap:0;margin-top:10px;flex-wrap:wrap}
.tab{padding:8px 17px;font-size:13.5px;color:var(--ink2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;user-select:none;transition:.12s}
.tab:hover{color:var(--pri);background:var(--pri-bg)}
.tab.on{color:var(--pri);font-weight:600;border-bottom-color:var(--pri);background:transparent}

/* ══ layout ══ */
.layout{max-width:1460px;margin:0 auto;padding:16px 22px 70px;display:flex;gap:20px;align-items:flex-start}
.side{width:214px;flex:none;position:sticky;top:112px}
main{flex:1;min-width:0}

.nav{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:6px;margin-bottom:12px}
.nav-t{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:1px;padding:7px 10px 5px}
.nav a{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;
  color:var(--ink2);text-decoration:none;font-size:12.5px;line-height:1.4;cursor:pointer}
.nav a:hover{background:var(--pri-bg);color:var(--pri)}
.nav a.on{background:var(--pri);color:#fff}
.nav a.on .nb{background:rgba(255,255,255,.24);color:#fff}
.nav .nt{flex:1;min-width:0}
.nb{font:600 10.5px/1 var(--mono);background:var(--idle-bg);color:var(--ink3);
  border-radius:4px;padding:3px 5px;flex:none;font-variant-numeric:tabular-nums}
.nb.full{background:var(--ok);color:#fff}
.nav-tot{border-top:1px solid var(--bd2);margin-top:5px;padding-top:7px}

.legend{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:11px 12px;font-size:12px}
.legend h4{margin:0 0 7px;font-size:11px;color:var(--ink3);letter-spacing:1px}
.legend div{display:flex;align-items:center;gap:7px;margin:4px 0;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:2px;flex:none}
.legend .me{background:var(--pri-bg);border:1px solid var(--pri-bd);border-radius:6px;
  padding:7px 8px;margin-top:8px;font-size:11.5px;color:#12456f;line-height:1.6}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:10px 13px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.stat.s0::before{background:var(--idle)} .stat.s1::before{background:var(--warn)}
.stat.s2::before{background:var(--ok)}   .stat.s3::before{background:var(--na)}
.stat.s4::before{background:var(--pri)}
.stat .n{font:700 23px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--ink3);margin-top:1px}

.tools{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;
  margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select,input.dept{
  border:1px solid var(--bd);border-radius:6px;padding:6px 9px;font:13px/1.4 inherit;
  color:var(--ink);background:#fff;outline:none}
input[type=search]{min-width:180px;flex:1;max-width:260px}
input[type=search]:focus,select:focus,input.dept:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(20,83,136,.1)}
.chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
.chk input{margin:0;cursor:pointer}

section.sec{margin-bottom:8px;scroll-margin-top:118px}
.sec-h{position:sticky;top:92px;z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:9px;padding:11px 0 8px;margin-bottom:9px;
  border-bottom:1.5px solid var(--ink);}
.sec-h::before{content:"";position:absolute;left:0;right:0;top:-26px;height:26px;background:var(--bg)}
.sec-h .sn{font:700 12px/1 var(--mono);background:var(--ink);color:#fff;border-radius:4px;padding:4px 7px;flex:none}
.sec-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
.sec-h .sc{margin-left:auto;font:12px/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-h .sc b{color:var(--ok);font-weight:700}

.item{background:var(--panel);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;overflow:hidden}
.item.urgent{border-left:3px solid var(--red)}
.item-h{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;cursor:pointer;transition:.1s}
.item-h:hover{background:#fafbfc}
.no{font:700 11.5px/1 var(--mono);background:var(--pri-bg);color:var(--pri);border:1px solid var(--pri-bd);
  border-radius:4px;padding:4px 6px;flex:none;margin-top:2px}
.ttl{flex:1;min-width:0}
.ttl .zh{font-weight:600;font-size:13.6px;line-height:1.5}
.ttl .en{color:var(--ink3);font-size:11.5px;margin-top:3px;font-style:italic;word-break:break-word;line-height:1.45}
.badge{font:600 11px/1 var(--mono);border-radius:11px;padding:5px 9px;flex:none;margin-top:2px;
  font-variant-numeric:tabular-nums;white-space:nowrap;cursor:default}
.badge.d0{background:var(--idle-bg);color:var(--idle);border:1px solid var(--idle-bd)}
.badge.d1{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.badge.d2{background:var(--ok);color:#fff;border:1px solid var(--ok)}
.badge.d3{background:var(--na-bg);color:var(--na);border:1px solid var(--na-bd)}
.caret{color:var(--ink3);font-size:10px;flex:none;margin-top:5px;transition:transform .18s}
.item.closed .caret{transform:rotate(-90deg)}
.item.closed .item-b{display:none}
.item-b{border-top:1px solid var(--bd2)}
.subs{margin:0;padding:10px 13px;background:#f9fafb;border-bottom:1px solid var(--bd2)}
.subs .sh{font-size:10.5px;color:var(--ink3);font-weight:700;letter-spacing:1px;margin-bottom:5px}
.subs ul{margin:0;padding-left:17px;columns:2;column-gap:26px}
.subs li{font-size:12.5px;color:var(--ink2);margin:2px 0;break-inside:avoid}
.subs li i{color:var(--ink3);font-size:11px;display:block;font-style:italic;line-height:1.4}

.tw{overflow-x:auto}
table.ft{width:100%;border-collapse:collapse;font-size:13px}
table.ft th{text-align:left;font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.4px;
  padding:7px 9px;border-bottom:1px solid var(--bd);background:#f8f9fb;white-space:nowrap}
table.ft td{padding:8px 9px;border-bottom:1px solid var(--bd2);vertical-align:middle;font-size:12.8px}
table.ft tbody tr:last-child td{border-bottom:none}
table.ft tbody tr:hover{background:#fafbfc}
table.ft tbody tr.zb{background:#fcfcfd}
table.ft tbody tr.fin td.ftext{color:var(--ink3)}
table.ft tbody tr.fin .fx{opacity:.55}
table.ft tbody tr.locked td{background:repeating-linear-gradient(135deg,transparent,transparent 9px,#fbfbf6 9px,#fbfbf6 18px)}
table.ft tbody tr.locked:hover td{background:#fbfbf6}
.seq{font:11.5px/1 var(--mono);color:var(--ink3);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.ftext{line-height:1.55;min-width:220px}
.fx{display:flex;align-items:flex-start;gap:7px}
.gtag{background:var(--idle-bg);color:var(--ink2);border:1px solid var(--idle-bd);border-radius:4px;
  font:600 10.5px/1.5 var(--mono);padding:1px 5px;flex:none;min-width:19px;text-align:center}
.own{font-size:12.3px;color:var(--ink2);white-space:nowrap}
.own .mine{color:var(--pri);font-weight:700}
.due{font:600 12px/1.4 var(--mono);white-space:nowrap}
.due.hot{color:var(--red)}
input.dept{width:100%;min-width:100px;font-size:12.3px;padding:4px 7px}
input.dept:focus{position:relative;z-index:5}
input.dept[readonly]{background:transparent;border-color:transparent;color:var(--ink2);cursor:default;padding-left:0}
.note{width:100%;min-width:104px;border:1px solid transparent;background:transparent;border-radius:5px;
  padding:4px 6px;font:12.3px/1.5 inherit;color:var(--ink2);outline:none}
.note:hover{border-color:var(--bd)}
.note:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 2px rgba(20,83,136,.08)}
.note[readonly]{cursor:default}
.note[readonly]:hover{border-color:transparent}
.who{display:block;font:10.5px/1.4 var(--mono);color:var(--ink3);margin-top:3px;white-space:nowrap}
.who b{color:var(--pri);font-weight:600}

.st{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:#fff;flex:none}
.st button{border:none;background:#fff;color:var(--ink3);font:12px/1 inherit;padding:7px 9px;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:.1s;min-height:29px}
.st button+button{border-left:1px solid var(--bd2)}
.st button:hover{background:var(--idle-bg);color:var(--ink)}
.st button.on{color:#fff;font-weight:600}
.st button.on[data-v=done]{background:var(--ok)}   .st button.on[data-v=done]:hover{background:#0c6649}
.st button.on[data-v=doing]{background:var(--warn)}.st button.on[data-v=doing]:hover{background:#8c5805}
.st button.on[data-v=todo]{background:var(--idle)} .st button.on[data-v=todo]:hover{background:#66717f}
.st button.on[data-v=na]{background:var(--na)}     .st button.on[data-v=na]:hover{background:#4554b0}
.st.dis{opacity:.5;filter:grayscale(.35)}
.st.dis button{cursor:not-allowed}
.st.dis button:hover{background:#fff;color:var(--ink3)}
.st.compact button{padding:6px 7px;font-size:11.5px}
.lockic{font-size:10.5px;color:var(--lock);white-space:nowrap;margin-top:3px;display:block}

.markall{font-size:11.5px;color:var(--ink3);background:#fff;border:1px solid var(--bd);border-radius:6px;
  padding:5px 9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.markall:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.markall:disabled{opacity:.45;cursor:not-allowed}
.markall:disabled:hover{border-color:var(--bd);color:var(--ink3);background:#fff}
.trash{border:1px solid var(--bd);background:#fff;color:var(--ink3);border-radius:5px;
  width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1;flex:none;padding:0}
.trash:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.trash:disabled{opacity:.35;cursor:not-allowed}
.trash:disabled:hover{border-color:var(--bd);color:var(--ink3);background:#fff}
.nf{padding:9px 13px 11px;color:var(--ink3);font-size:12.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.pcard{background:var(--panel);border:1px solid var(--bd);border-radius:9px;margin-bottom:8px;overflow:hidden}
.pc-h{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;background:#f8f9fb;transition:.1s}
.pc-h:hover{background:var(--pri-bg)}
.pc-h .who2{font-weight:700;font-size:14.5px}
.pc-h .dp{font-size:12px;color:var(--ink3);background:var(--idle-bg);border-radius:4px;padding:2px 7px}
.pc-h .mini{margin-left:auto;font:12px/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-h .mini b{color:var(--ok)}
.pcard.closed .pc-b{display:none}

.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:13px}
.rcard{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:14px 15px}
.rcard h3{margin:0 0 11px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.rcard h3::before{content:"";width:3px;height:13px;background:var(--pri);border-radius:2px}
.rrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
.rrow .nm{width:112px;flex:none;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar{flex:1;height:15px;background:var(--bd2);border-radius:3px;overflow:hidden;display:flex}
.rbar i{height:100%}
.rrow .vv{width:56px;flex:none;text-align:right;font:11.5px/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.risk{background:var(--red-bg);border:1px solid var(--red-bd);border-radius:8px;padding:12px 14px;margin-top:13px}
.risk h3{margin:0 0 8px;font-size:13.5px;color:var(--red);display:flex;align-items:center;gap:7px}
.risk h3::before{content:"";width:3px;height:13px;background:var(--red);border-radius:2px}
.risk li{font-size:12.8px;color:#7d2a20;margin:5px 0 5px 18px;line-height:1.65}
.risk b{color:var(--red)}

/* log table */
table.lg{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel)}
table.lg th{text-align:left;font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.4px;
  padding:8px 10px;border-bottom:1px solid var(--bd);background:#f8f9fb;white-space:nowrap;position:sticky;top:0}
table.lg td{padding:7px 10px;border-bottom:1px solid var(--bd2);vertical-align:top}
table.lg tbody tr:hover{background:#fafbfc}
.chg{font:11.5px/1.5 var(--mono);white-space:nowrap}
.chg .o{color:var(--ink3);text-decoration:line-through}
.chg .a{color:var(--ink3);margin:0 4px}
.chg .n{font-weight:700}

.hint{background:var(--pri-bg);border:1px solid var(--pri-bd);border-radius:8px;
  padding:9px 12px;font-size:12.5px;color:#12456f;margin-bottom:13px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;
  padding:9px 12px;font-size:12.5px;color:#7a4d05;margin-bottom:13px;display:none}
.empty{text-align:center;color:var(--ink3);padding:44px 0;font-size:13.5px}
.foot{text-align:center;color:var(--ink3);font-size:11.5px;padding:22px 0 0;
  border-top:1px solid var(--bd);margin-top:24px;line-height:1.8}
.pchk{display:none}

/* modal */
.mask{position:fixed;inset:0;background:rgba(16,28,44,.55);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:12px;width:430px;max-width:100%;padding:24px 24px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal h3{margin:0 0 5px;font-size:17px}
.modal p{margin:0 0 16px;font-size:12.8px;color:var(--ink2);line-height:1.7}
.modal label{display:block;font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.5px;margin:12px 0 5px}
.modal select,.modal input{width:100%;border:1px solid var(--bd);border-radius:7px;padding:9px 11px;
  font:13.5px/1.4 inherit;color:var(--ink);outline:none}
.modal select:focus,.modal input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(20,83,136,.1)}
.modal .acts{display:flex;gap:8px;margin-top:20px}
.modal .acts .btn{flex:1;padding:9px}
.adminbox{border:1px dashed var(--warn-bd);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-top:14px}
.adminbox label{color:var(--warn);margin:0 0 6px}
.note-sm{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:12px}

@media(max-width:1080px){ .side{display:none} .stats{grid-template-columns:repeat(3,1fr)} .subs ul{columns:1} }
@media(max-width:720px){
  .layout{padding:14px 12px 60px} .hd{padding:10px 12px 0}
  .hd-act,.pstrip{width:100%;margin-left:0} .stats{grid-template-columns:repeat(2,1fr)}
  table.ft th:nth-child(8),table.ft td:nth-child(8){display:none}
  .sec-h{position:static}
}

@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  body{background:#fff;font-size:10.5pt}
  header{position:static;box-shadow:none;border-bottom:1.5pt solid #000;margin-bottom:8pt}
  .hd-act,.tabs,.tools,.side,.caret,.st,.markall,.legend,.pstrip,.hint,.foot,.stat,.idchip,.trash,.warn{display:none !important}
  .layout{padding:0;display:block;max-width:none}
  .sec-h{position:static;background:none;padding:6pt 0 3pt;margin-bottom:5pt;break-after:avoid}
  .sec-h::before{display:none}
  .item,.pcard,.rcard{border:.6pt solid #999;border-radius:0;break-inside:avoid;margin-bottom:5pt}
  .item-b{display:block !important} .item.closed .item-b{display:block !important}
  .pcard.closed .pc-b{display:block !important}
  .ttl .en{font-size:8pt;color:#555}
  .subs{background:#f4f4f4;padding:5pt 8pt} .subs ul{columns:2} .subs li{font-size:8.5pt}
  table.ft{font-size:9pt}
  table.ft th{background:#eee !important;color:#000;font-size:8pt;padding:4pt 5pt;border-bottom:.6pt solid #666}
  table.ft td{padding:4pt 5pt;border-bottom:.4pt solid #ccc}
  .note,.dept{border:none !important;background:transparent !important;padding:0 !important;font-size:9pt;color:#000}
  .pchk{display:table-cell !important;width:22pt;text-align:center;font-size:13pt;color:#000}
  .pst{display:inline !important;font-size:8.5pt;border:.5pt solid #666;border-radius:2pt;padding:1pt 4pt;white-space:nowrap}
  .who{display:block !important;font-size:7.5pt;color:#555}
  .ftext{min-width:auto}
}
.pst{display:none}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="hd-row">
      <div class="brand">
        <h1>审计应对 Check list</h1>
        <span class="meta">客户审计 · 逐项核对 · 谁改的一目了然</span>
      </div>
      <div class="pstrip"><div class="bar" id="hbar"></div><span class="tx" id="htx"></span></div>
      <div id="idchip"></div>
      <div class="hd-act">
        <button class="btn" onclick="expCsv()">导出 CSV</button>
        <button class="btn" onclick="window.print()">打印</button>
        <button class="btn sm dgr" id="btnReset" onclick="resetAll()">清空</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on" data-t="check">逐项核对</div>
      <div class="tab" data-t="person">按责任人派工</div>
      <div class="tab" data-t="report">进度统计</div>
      <div class="tab" data-t="log">变更日志</div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <div class="nav"><div class="nav-t">目录 · 点击跳转</div><div id="nav"></div></div>
    <div class="legend">
      <h4>状态图例</h4>
      <div><span class="dot" style="background:var(--idle)"></span>未开始</div>
      <div><span class="dot" style="background:var(--warn)"></span>准备中</div>
      <div><span class="dot" style="background:var(--ok)"></span>已就绪（可随时调阅）</div>
      <div><span class="dot" style="background:var(--na)"></span>不适用</div>
      <div><span class="dot" style="background:var(--red)"></span>9/11 截止 · 尚未开始</div>
      <div><span class="dot" style="background:var(--lock)"></span>他人已改 · 你只读</div>
      <div class="me" id="permInfo"></div>
    </div>
  </aside>

  <main>
    <div class="stats" id="stats"></div>
    <div class="tools" id="tools">
      <input type="search" id="q" placeholder="搜索主题 / 文件 / 责任人 / 部门…">
      <select id="fowner"><option value="">全部责任人</option></select>
      <select id="fstatus">
        <option value="">全部状态</option>
        <option value="todo">未开始</option><option value="doing">准备中</option>
        <option value="done">已就绪</option><option value="na">不适用</option>
      </select>
      <label class="chk"><input type="checkbox" id="fhide"> 只看未完成</label>
      <label class="chk"><input type="checkbox" id="furg"> 只看紧急</label>
      <label class="chk" id="fmineWrap"><input type="checkbox" id="fmine"> 只看我负责的</label>
      <button class="btn sm" onclick="toggleAll(1)">展开</button>
      <button class="btn sm" onclick="toggleAll(0)">折叠</button>
      <button class="btn sm" onclick="clearFilter()">重置筛选</button>
      <button class="btn sm" id="btnImport" onclick="impCsv()" style="display:none">导入合并</button>
    </div>

    <div id="lsWarn" class="warn"></div>
    <datalist id="dlDept"></datalist>
    <div id="view"></div>

    <div class="foot">
      状态、部门与备注保存在本机浏览器（localStorage），换设备不同步 —— 各人填完请「导出 CSV」交质量管理人员汇总。<br>
      <b>权限说明</b>：只能修改责任人包含自己的条目；已被他人修改的记录他人只读；管理员（马宏宇）可修改全部并清除记录。<br>
      本页权限用于防止误改与留痕，静态页面无法做到强制安全隔离。
    </div>
  </main>
</div>

<input type="file" id="fileIn" accept=".csv,text/csv" style="display:none">

function load(k,d){ try{ const v=JSON.parse(localStorage.getItem(KEY+'_'+k)); return v===null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(KEY+'_'+k,JSON.stringify(v)); }

function now(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function stamp(rec){ return rec&&rec.at?rec.at.slice(5,16).replace(' ',' '):''; }

/* ── v1 迁移 ── */
(function migrate(){
  try{
    const os=JSON.parse(localStorage.getItem(OLD+'_st'));
    if(os && Object.keys(os).length && !Object.keys(S).length){
      const n={};
      for(const k in os){ const v=os[k]; n[k]= (v&&typeof v==='object')? v : {v:String(v||'todo'), by:MIG, at:''}; }
      S=n; save('st',S);
      const on=JSON.parse(localStorage.getItem(OLD+'_nt'))||{}; const nn={};
      for(const k in on) nn[k]= (on[k]&&typeof on[k]==='object')? on[k] : {v:String(on[k]||''), by:'', at:''};
      N=nn; save('nt',N);
    }
  }catch(e){}
})();

/* ── flatten ── */
const FLAT=[];

  sec.items.forEach(it=>{
    const bo=it.owner||'', bd=it.due||'';
    if(!it.files.length){
      FLAT.push({id:it.id,cat:sec.cat,catIdx:si,zh:it.zh,en:it.en,cat_en:it.cat_en||'',
        text:'(本条无文件清单)',g:'',owner:bo,due:bd,key:it.id+'#-1',noFile:true});
    }
    it.files.forEach((f,i)=>{
      FLAT.push({id:it.id,cat:sec.cat,catIdx:si,zh:it.zh,en:it.en,cat_en:it.cat_en||'',
        text:f.t,g:f.g||'',owner:f.owner||bo,due:f.due||bd,key:it.id+'#'+i,noFile:false});

});
FLAT.forEach((f,i)=>{ f.seq=i+1; });
const BYKEY={}; FLAT.forEach(f=>BYKEY[f.key]=f);
const TOTAL=FLAT.length;
const NAMES=[...new Set([ADMIN_NAME, ...Object.keys(PERSON_DEPT),
  ...FLAT.flatMap(f=>f.owner.split(/[、,，]/).map(x=>x.trim()).filter(Boolean))])]
  .sort((a,b)=>a.localeCompare(b,'zh'));

function deptOf(o){ if(!o||o==='/') return '';
  if(D['P::'+o]) return D['P::'+o];
  return PERSON_DEPT[o.split(/[、,，]/)[0].trim()]||PERSON_DEPT[o]||''; }
function statOf(f){ const r=S[f.key]; return r?(r.v||'todo'):'todo'; }
function isHot(f){ return statOf(f)==='todo' && /9月1[01]/.test(f.due||''); }
function isMine(f){ return !!ME && f.owner.split(/[、,，]/).map(x=>x.trim()).includes(ME); }

/* ── 权限 ── */
function whoLabel(by){ return by===MIG?'（旧版）':by; }
function canEdit(f){
  if(IS_ADMIN) return true;
  if(!ME) return false;
  if(!isMine(f)) return false;                       // 不是我的责任范围
  const r=S[f.key];
  if(r && r.by && r.by!==ME && r.by!==MIG) return false;  // 别人已改 → 只读
  return true;
}
function lockReason(f){
  if(!ME) return '请先选择姓名';
  if(!isMine(f)) return '责任人不含你 · 只读';
  const r=S[f.key];
  if(r&&r.by&&r.by!==ME&&r.by!==MIG) return `${r.by} 已修改 · 只读`;
  return '';
}

/* ── 写操作（带留痕） ── */
function logIt(f,field,from,to){
  LOG.push({t:now(), who:ME||'（未登录）', seq:String(f.seq).padStart(3,'0'), id:f.id,
            zh:f.zh, field, from:String(from==null?'':from), to:String(to==null?'':to)});
  if(LOG.length>4000) LOG=LOG.slice(-4000);
  save('lg',LOG);
}
function setStat(f,v){
  if(!canEdit(f)) return;
  const old=statOf(f), oldBy=(S[f.key]||{}).by||'';
  if(v===old && oldBy===ME) return;
  S[f.key]={v, by:ME, at:now()}; save('st',S);
  if(old!==v) logIt(f,'状态',SLAB[old],SLAB[v]);
  render();
}
function setNote(f,v){
  if(!canEdit(f)) return;
  const old=(N[f.key]||{}).v||'';
  if(old===v) return;
  N[f.key]={v, by:ME, at:now()}; save('nt',N);
  logIt(f,'备注',old.slice(0,40),v.slice(0,40));
}
function setDept(f,v){
  if(!canEdit(f)) return;
  const p=f.owner; if(!p) return;
  const old=D['P::'+p]||deptOf(p);
  if(old===v) return;
  D['P::'+p]=v; save('dp',D);
  logIt(f,'责任部门',old,v);
  render();
}
function clearRec(f){
  if(!IS_ADMIN) return;
  const o=S[f.key], n=N[f.key];
  if(!o && !(n&&n.v)){                     // 本来就是空的，不记一笔假日志
    if(!confirm('该项尚无记录（未开始、无备注），无需清除。\n\n#'+String(f.seq).padStart(3,'0')+' '+f.text)) return;
    return;
  }
  if(!confirm(`管理员操作：清除 #${String(f.seq).padStart(3,'0')} 的状态与备注？\n\n${f.text}`)) return;
  delete S[f.key]; delete N[f.key]; save('st',S); save('nt',N);
  LOG.push({t:now(), who:ME+'（管理员）', seq:String(f.seq).padStart(3,'0'), id:f.id, zh:f.zh,
            field:'清除记录', from:`${SLAB[o?v(o):'todo']}${n&&n.v?' / '+n.v.slice(0,20):''}`, to:'（已清除）'});
  save('lg',LOG); render();
  function v(x){ return (x&&x.v)||'todo'; }
}

/* ── 身份 ── */

function openModal(){
  const m=document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML=`<div class="modal">
    <h3>选择你的姓名</h3>
    <p>系统会记录每条改动是谁做的。你<b>只能修改责任人包含自己的条目</b>；<br>已被他人修改的记录，你将变为只读。</p>
    <label>姓名</label>

function closeModal(){ const m=document.getElementById('mask'); if(m) m.remove(); }
function confirmId(){
  const sel=document.getElementById('mName');
  let name = sel.value==='__other' ? document.getElementById('mOther').value.trim() : sel.value;

    else { alert('口令不正确，或该姓名不是管理员'); return; } }
  ME=name; IS_ADMIN=admin;

  closeModal(); render();

/* ── render ── */
function render(){ renderStats(); renderNav(); renderId(); renderView(); bind(); }

function match(f){
  if(catFilter && f.cat!==catFilter) return false;
  const q=document.getElementById('q').value.trim().toLowerCase();
  const ow=document.getElementById('fowner').value;
  const st=document.getElementById('fstatus').value;
  if(document.getElementById('fhide').checked && ['done','na'].includes(statOf(f))) return false;
  if(document.getElementById('furg').checked && !isHot(f)) return false;
  if(document.getElementById('fmine').checked && !isMine(f)) return false;
  if(ow && !f.owner.split(/[、,，]/).some(x=>x.trim()===ow)) return false;
  if(st && statOf(f)!==st) return false;
  if(q && !(f.zh+' '+f.en+' '+f.text+' '+f.owner+' '+f.cat+' '+f.cat_en+' '+deptOf(f.owner)).toLowerCase().includes(q)) return false;
  return true;
}

function renderStats(){
  let c={todo:0,doing:0,done:0,na:0};
  FLAT.forEach(f=>c[statOf(f)]++);
  const fin=c.done+c.na, p=Math.round(fin/TOTAL*100), hot=FLAT.filter(isHot).length;
  const cells=[['s4',TOTAL,'核对项总数'],['s2',c.done,'已就绪'],['s1',c.doing,'准备中'],
               ['s0',c.todo,'未开始'],['s3',c.na,'不适用']];
  document.getElementById('stats').innerHTML=cells.map(x=>
    `<div class="stat ${x[0]}"><div class="n">${x[1]}</div><div class="l">${x[2]}</div></div>`).join('')
    + (hot?`<div class="stat" style="grid-column:span 5;background:var(--red-bg);border-color:var(--red-bd)">
        <div class="n" style="color:var(--red);font-size:15px">⚠ 紧急：${hot} 项截止 9/10–9/11 且尚未开始</div></div>`:'');
  const bw=n=>n/TOTAL*100;
  document.getElementById('hbar').innerHTML=
    `<i style="width:${bw(c.done)}%;background:var(--ok)"></i>
     <i style="width:${bw(c.na)}%;background:var(--na)"></i>
     <i style="width:${bw(c.doing)}%;background:var(--warn)"></i>`;
  document.getElementById('htx').innerHTML=`<b>${p}%</b> 完成　${fin}/${TOTAL}`;
}

function renderNav(){
  const rows=DATA.map((s,i)=>{
    const all=FLAT.filter(f=>f.catIdx===i);
    const fin=all.filter(f=>['done','na'].includes(statOf(f))).length;
    return {cat:s.cat,fin,t:all.length,full:fin===all.length};
  });
  const tot=FLAT.filter(f=>['done','na'].includes(statOf(f))).length;
  document.getElementById('nav').innerHTML=
    rows.map(r=>`<a data-c="${esc(r.cat)}" class="${catFilter===r.cat?'on':''}">
      <span class="nt">${esc(r.cat)}</span><span class="nb ${r.full?'full':''}">${r.fin}/${r.t}</span></a>`).join('')
    + `<div class="nav-tot"><a data-c="" class="${catFilter?'':'on'}">
      <span class="nt"><b>全部</b></span><span class="nb ${tot===TOTAL?'full':''}">${tot}/${TOTAL}</span></a></div>`;
}

function renderView(){
  const v=document.getElementById('view');
  v.innerHTML = tab==='check'?renderCheck() : tab==='person'?renderPerson()
              : tab==='log'?renderLog() : renderReport();
}

function renderCheck(){
  let out='';
  DATA.forEach((sec,si)=>{
    const blocks=sec.items.map(it=>{
      const rows=FLAT.filter(f=>f.catIdx===si&&f.id===it.id);
      if(!rows.some(match)) return '';
      const fin=rows.filter(f=>['done','na'].includes(statOf(f))).length;
      const hot=rows.some(isHot);
      const subs=(it.subs&&it.subs.length)?
        `<div class="subs"><div class="sh">原文检查要点</div><ul>${
          it.subs.map(s=>`<li>${esc(s[1])}<i>${esc(s[0])}</i></li>`).join('')}</ul></div>`:'';
      const editable=rows.filter(canEdit).length;
      const body = rows.some(r=>!r.noFile)
        ? `<div class="tw"><table class="ft"><thead><tr>
             <th class="pchk">☐</th><th style="width:44px">序号</th><th>准备文件清单（逐项核对）</th>
             <th style="width:108px">责任部门</th><th style="width:126px">责任人</th>
             <th style="width:80px">完成时间</th><th style="width:168px">状态 / 更新人</th>
             <th style="min-width:110px">备注</th><th style="width:34px"></th>
           </tr></thead><tbody>${rows.filter(match).map(rowHtml).join('')}</tbody></table></div>
           <div style="padding:7px 13px 9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap">
             <button class="markall" data-all="${esc(it.id)}" ${editable?'':'disabled'}>
               本组标记「已就绪」${editable?`（${editable} 项）`:`（无可改项）`}</button>
             <button class="markall" data-reset="${esc(it.id)}" ${editable?'':'disabled'}>本组重置</button>
           </div>`
        : `<div class="nf"><span class="seq" style="flex:none">#${String(rows[0].seq).padStart(3,'0')}</span>
             <span style="flex:none">本条无需提交文件</span>${rowNote(rows[0])}</div>`;
      const op=openSet[it.id]===undefined?(fin<rows.length):openSet[it.id];
      return `<div class="item ${op?'':'closed'} ${hot?'urgent':''}" data-it="${esc(it.id)}">
        <div class="item-h">
          <span class="no">${esc(it.id)}</span>
          <div class="ttl"><div class="zh">${esc(it.zh)}</div>
            <div class="en">${esc(it.cat_en?'['+it.cat_en+'] ':'')}${esc(it.en)}</div></div>
          <span class="badge ${SCLS[fin===rows.length?'done':(fin?'doing':'todo')]}">${fin}/${rows.length}</span>
          <span class="caret">▼</span>
        </div><div class="item-b">${subs}${body}</div></div>`;
    }).join('');
    if(!blocks) return;
    const all=FLAT.filter(f=>f.catIdx===si);
    const fin=all.filter(f=>['done','na'].includes(statOf(f))).length;
    const vis=all.filter(match).length;
    out+=`<section class="sec" id="sec-${si}">
      <div class="sec-h"><span class="sn">${'0'+(si+1)}</span><h2>${esc(sec.cat)}</h2>
      <span class="sc">已完成 <b>${fin}</b>／${all.length}${vis!==all.length?`　·　筛出 ${vis}`:''}</span></div>
      ${blocks}</section>`;
  });
  return out||'<div class="empty">没有符合条件的条目，试试「重置筛选」</div>';
}

function lockedByOther(f){ const r=S[f.key]; return !canEdit(f) && r && r.by && r.by!==ME && r.by!==MIG; }

function rowHtml(f,i){
  const s=statOf(f), ok=canEdit(f), lk=lockReason(f);
  const rec=S[f.key], nr=N[f.key];
  return `<tr class="${['done','na'].includes(s)?'fin':''} ${i%2?'zb':''} ${lockedByOther(f)?'locked':''}" data-k="${esc(f.key)}">
    <td class="pchk">☐</td>
    <td class="seq">#${String(f.seq).padStart(3,'0')}</td>
    <td class="ftext"><span class="fx">${f.g?`<span class="gtag">${esc(f.g)}</span>`:''}<span>${esc(f.text)}</span></span></td>
    <td><input class="dept" list="dlDept" data-k="${esc(f.key)}" value="${esc(deptOf(f.owner))}"
         placeholder="—" ${ok?'':'readonly'}></td>
    <td class="own">${f.owner?f.owner.split(/[、,，]/).map(x=>
        `<span class="${x.trim()===ME?'mine':''}">${esc(x.trim())}</span>`).join('、'):'—'}</td>
    <td class="due ${isHot(f)?'hot':''}">${esc(f.due)||'—'}</td>
    <td>
      <div class="st ${ok?'':'dis'}" title="${esc(lk)}">
        ${STAT.map(v=>`<button data-v="${v}" class="${s===v?'on':''}" ${ok?'':'disabled'}>${SLAB[v]}</button>`).join('')}
      </div>
      <span class="pst">${SLAB[s]}</span>
      ${rec&&rec.by?`<span class="who"><b>${esc(whoLabel(rec.by))}</b> ${esc(stamp(rec))}</span>`:''}
      ${lockedByOther(f)?`<span class="lockic">🔒 ${esc(whoLabel(rec.by))} 已修改 · 只读</span>`:''}
    </td>
    <td><input class="note" data-k="${esc(f.key)}" value="${esc((nr&&nr.v)||'')}"
         placeholder="${ok?'备注…':'—'}" ${ok?'':'readonly'}></td>
    <td>${IS_ADMIN?`<button class="trash" data-clear="${esc(f.key)}" title="管理员清除此记录">🗑</button>`:''}</td>
  </tr>`;
}
function rowNote(f){
  const s=statOf(f), ok=canEdit(f), lk=lockReason(f);
  return `<div class="st compact ${ok?'':'dis'}" title="${esc(lk)}">
      ${STAT.map(v=>`<button data-v="${v}" data-k="${esc(f.key)}" class="${s===v?'on':''}" ${ok?'':'disabled'}>${SLAB[v]}</button>`).join('')}
    </div>
    <input class="note" style="flex:1;min-width:130px" data-k="${esc(f.key)}"
      value="${esc((N[f.key]&&N[f.key].v)||'')}" placeholder="${ok?'备注…':'—'}" ${ok?'':'readonly'}>`;
}

function renderPerson(){
  const map={};
  FLAT.forEach(f=>{
    if(!f.owner||f.owner==='/'){ (map['__none__']=map['__none__']||[]).push(f); return; }
    f.owner.split(/[、,，]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{ (map[p]=map[p]||[]).push(f); });
  });
  const names=Object.keys(map).filter(n=>n!=='__none__')
    .sort((a,b)=>deptOf(a).localeCompare(deptOf(b),'zh')||a.localeCompare(b,'zh'));
  if(map['__none__']) names.push('__none__');
  let out=`<div class="hint">按责任人聚合。${ME?`当前身份 <b>${esc(ME)}</b>${IS_ADMIN?'（管理员）':''} —— 只能修改自己的条目。`:'<b>未选择姓名，当前只读。</b>'}</div>`, any=false;
  names.forEach(n=>{
    const rows=map[n].filter(match);
    if(!rows.length) return;
    any=true;
    const dn=n==='__none__'?'（未指定）':n, dp=n==='__none__'?'—':(deptOf(n)||'—');
    const fin=rows.filter(r=>['done','na'].includes(statOf(r))).length;
    const op=openSet['P:'+n]===undefined?false:openSet['P:'+n];
    out+=`<div class="pcard ${op?'':'closed'}" data-pn="${esc(n)}">
      <div class="pc-h"><span class="caret">▼</span><span class="who2">${esc(dn)}</span><span class="dp">${esc(dp)}</span>
        <span class="mini">共 ${rows.length} 项 · 完成 <b>${fin}</b> · 待办 ${rows.length-fin}</span></div>
      <div class="pc-b"><div class="tw"><table class="ft"><thead><tr>
        <th class="pchk">☐</th><th style="width:44px">序号</th><th style="width:34%">准备文件清单</th>
        <th>所属审计条目</th><th style="width:80px">完成时间</th><th style="width:168px">状态 / 更新人</th><th>备注</th>
      </tr></thead><tbody>${rows.map((f,i)=>{
        const s=statOf(f), ok=canEdit(f), lk=lockReason(f), rec=S[f.key];
        return `<tr class="${['done','na'].includes(s)?'fin':''} ${i%2?'zb':''} ${lockedByOther(f)?'locked':''}" data-k="${esc(f.key)}">
          <td class="pchk">☐</td><td class="seq">#${String(f.seq).padStart(3,'0')}</td>
          <td class="ftext">${esc(f.text)}</td>
          <td class="own">${esc(f.id)} ${esc(short(f.zh,20))}</td>
          <td class="due ${isHot(f)?'hot':''}">${esc(f.due)||'—'}</td>
          <td><div class="st ${ok?'':'dis'}" title="${esc(lk)}">
              ${STAT.map(v=>`<button data-v="${v}" class="${s===v?'on':''}" ${ok?'':'disabled'}>${SLAB[v]}</button>`).join('')}
            </div><span class="pst">${SLAB[s]}</span>
            ${rec&&rec.by?`<span class="who"><b>${esc(whoLabel(rec.by))}</b> ${esc(stamp(rec))}</span>`:''}
            ${lockedByOther(f)?`<span class="lockic">🔒 ${esc(whoLabel(rec.by))} 已修改 · 只读</span>`:''}</td>
          <td><input class="note" data-k="${esc(f.key)}" value="${esc((N[f.key]&&N[f.key].v)||'')}"
               placeholder="${ok?'备注…':'—'}" ${ok?'':'readonly'}></td>
        </tr>`;}).join('')}</tbody></table></div></div></div>`;
  });
  return out+(any?'':'<div class="empty">没有符合条件的责任人</div>');
}

function renderLog(){
  const head=`<div class="hint">记录每一次状态、备注、部门的改动 —— 谁在什么时候改了哪一条。<b>审计留痕可用此表导出。</b></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">

    </tr></thead><tbody>${rows.map(l=>`<tr>
      <td style="white-space:nowrap;font:11.5px/1.5 var(--mono);color:var(--ink3)">${esc(l.t)}</td>
      <td><b>${esc(l.who)}</b></td>
      <td class="seq">#${esc(l.seq)}</td><td class="seq">${esc(l.id)}</td>
      <td style="font-size:12px">${esc(short(l.zh,26))}</td>
      <td style="font-size:12px;color:var(--ink2)">${esc(l.field)}</td>
      <td><span class="chg"><span class="o">${esc(l.from||'空')}</span><span class="a">→</span><span class="n">${esc(l.to||'空')}</span></span></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function renderReport(){
  const byCat={},byDept={},byOwn={};
  FLAT.forEach(f=>{
    const s=statOf(f);
    (byCat[f.cat]=byCat[f.cat]||{todo:0,doing:0,done:0,na:0,t:0})[s]++; byCat[f.cat].t++;
    const dp=deptOf(f.owner)||'（未指定）';
    (byDept[dp]=byDept[dp]||{todo:0,doing:0,done:0,na:0,t:0})[s]++; byDept[dp].t++;
    (f.owner||'（未指定）').split(/[、,，]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
      (byOwn[p]=byOwn[p]||{todo:0,doing:0,done:0,na:0,t:0})[s]++; byOwn[p].t++;
    });
  });
  const mk=(o,w)=>Object.keys(o).sort((a,b)=>o[b].t-o[a].t).map(k=>{
    const c=o[k], fin=c.done+c.na;
    return `<div class="rrow"><span class="nm" title="${esc(k)}" style="width:${w}px">${esc(short(k,14))}</span>
      <span class="rbar"><i style="width:${c.done/c.t*100}%;background:var(--ok)"></i>
      <i style="width:${c.na/c.t*100}%;background:var(--na)"></i>
      <i style="width:${c.doing/c.t*100}%;background:var(--warn)"></i></span>
      <span class="vv">${fin}/${c.t}</span></div>`;
  }).join('');
  const hot=FLAT.filter(isHot), noOwn=FLAT.filter(f=>!f.owner||f.owner==='/');
  return `<div class="rgrid">
    <div class="rcard"><h3>按分类</h3>${mk(byCat,150)}</div>

      <li><b>2.5</b> 温控车温度分布验证报告须先经<b>研发部审核</b>后方可提交客户查看，未经审核不得外发。</li>
      <li>需提前演练的演示项：<b>2.6</b>（安智/易流系统说明演示）、<b>5.1</b>（调度系统现场演示）、<b>5.3</b>（数据备份记录演示，9月11日）。</li>
      <li>跨区域协同：<b>2.4</b> 广州保温罩预冷/出入库记录（高艳琼）。</li>
      <li>差异化截止：3.7 审计与自检 <b>9/12</b>；3.8 分包商管理 <b>9/13</b>；2.6 第 2 组（异常处理记录、24h 监控岗日志）<b>9/14</b>。</li>
    </ul></div>`;
}

/* ── events ── */
function bind(){
  document.querySelectorAll('.item-h').forEach(h=>h.onclick=e=>{
    if(e.target.closest('input')) return;
    const it=h.parentElement; openSet[it.dataset.it]=it.classList.contains('closed');
    it.classList.toggle('closed');
  });
  document.querySelectorAll('.pc-h').forEach(h=>h.onclick=()=>{
    const c=h.parentElement; openSet['P:'+c.dataset.pn]=c.classList.contains('closed');
    c.classList.toggle('closed');
  });
  document.querySelectorAll('.st button').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(b.disabled) return;
    const tr=b.closest('tr'); const k=(tr&&tr.dataset.k)||b.dataset.k;
    const f=BYKEY[k]; if(!f||!canEdit(f)) return;
    setStat(f,b.dataset.v);
  });
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); if(b.disabled) return;
    const list=FLAT.filter(f=>f.id===b.dataset.all&&canEdit(f));
    if(!list.length) return;
    if(!confirm(`将你有权修改的 ${list.length} 项标记为「已就绪」？`)) return;
    list.forEach(f=>{ const o=statOf(f); S[f.key]={v:'done',by:ME,at:now()}; save('st',S);
      if(o!=='done') logIt(f,'状态',SLAB[o],'已就绪'); });
    save('st',S); save('lg',LOG); render();
  });
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); if(b.disabled) return;
    const list=FLAT.filter(f=>f.id===b.dataset.reset&&canEdit(f));
    if(!list.length) return;
    if(!confirm(`将你有权修改的 ${list.length} 项重置为「未开始」？`)) return;
    list.forEach(f=>{ const o=statOf(f); S[f.key]={v:'todo',by:ME,at:now()}; save('st',S);
      if(o!=='todo') logIt(f,'状态',SLAB[o],'未开始'); });
    save('st',S); save('lg',LOG); render();
  });
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const f=BYKEY[b.dataset.clear]; if(f) clearRec(f);
  });
  document.querySelectorAll('input.dept').forEach(i=>{
    i.onchange=()=>{ const f=BYKEY[i.dataset.k]; if(f) setDept(f,i.value); };
  });
  document.querySelectorAll('input.note').forEach(i=>{
    i.onchange=()=>{ const f=BYKEY[i.dataset.k]; if(f) setNote(f,i.value); };
  });
}

['q','fowner','fstatus','fhide','furg','fmine'].forEach(id=>{

  el.addEventListener(id==='q'?'input':'change', render);
});
document.getElementById('nav').onclick=e=>{
  const a=e.target.closest('a'); if(!a) return;

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{

function toggleAll(v){

  else document.querySelectorAll('.item').forEach(c=>{openSet[c.dataset.it]=!!v;c.classList.toggle('closed',!v);});

function clearFilter(){
  catFilter=''; document.getElementById('q').value='';

function resetAll(){
  if(!IS_ADMIN){ alert('仅管理员可清空全部数据。'); return; }
  if(!confirm('管理员操作：清空所有状态、备注、部门与变更日志？此操作不可撤销。')) return;

function clearLog(){
  if(!IS_ADMIN) return;

/* CSV */
function csvEsc(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }
function dl(name,csv){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click();
}
function expCsv(){
  const head=['序号','分类','编号','审计主题（中文）','英文原文','分组','准备文件清单',
              '责任部门','责任人','完成时间','状态','更新人','更新时间','备注','备注更新人'];
  const rows=FLAT.map(f=>{ const r=S[f.key]||{}, n=N[f.key]||{};
    return [String(f.seq).padStart(3,'0'),f.cat,f.id,f.zh,f.en,f.g,f.text,
      deptOf(f.owner),f.owner,f.due,SLAB[statOf(f)],r.by||'',r.at||'',(n.v||''),n.by||'']; });
  dl('审计应对Checklist_'+new Date().toISOString().slice(0,10)+'.csv',
     [head,...rows].map(r=>r.map(csvEsc).join(',')).join('\n'));
}
function expLog(){
  const head=['时间','操作人','序号','条目编号','审计主题','字段','原值','新值'];
  const rows=LOG.map(l=>[l.t,l.who,l.seq,l.id,l.zh,l.field,l.from,l.to]);
  dl('审计变更日志_'+new Date().toISOString().slice(0,10)+'.csv',
     [head,...rows].map(r=>r.map(csvEsc).join(',')).join('\n'));
}
function parseCsv(t){
  const rows=[]; let row=[],cur='',q=false;
  t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function impCsv(){
  if(!IS_ADMIN){ alert('仅管理员可导入合并。'); return; }
  const inp=document.getElementById('fileIn');
  inp.value='';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const rows=parseCsv(String(rd.result));
      if(rows.length<2){ alert('CSV 内容为空'); return; }
      const idx={}; rows[0].forEach((h,i)=>idx[String(h).trim()]=i);
      const g=(r,k)=> idx[k]===undefined?'':(r[idx[k]]||'').trim();
      let add=0,upd=0,skip=0;
      for(let i=1;i<rows.length;i++){
        const r=rows[i]; if(!r.length) continue;
        const seq=g(r,'序号'); let f=null;
        if(seq) f=FLAT.find(x=>String(x.seq).padStart(3,'0')===seq);
        if(!f){ const id=g(r,'编号'), tx=g(r,'准备文件清单');
          f=FLAT.find(x=>x.id===id&&x.text===tx); }
        if(!f){ skip++; continue; }
        const st=g(r,'状态'), by=g(r,'更新人'), at=g(r,'更新时间');
        const nt=g(r,'备注'), nby=g(r,'备注更新人');
        const code=Object.keys(SLAB).find(k=>SLAB[k]===st);
        if(code){
          const prev=S[f.key];
          if(!prev){ add++; } else if(prev.v!==code){ upd++; }
          S[f.key]={v:code, by:by||prev?.by||'', at:at||prev?.at||''};
        }
        if(nt){ const prevN=N[f.key]; if(!prevN||prevN.v!==nt){ N[f.key]={v:nt, by:nby||'', at:at||''}; } }
      }
      save('st',S); save('nt',N);
      LOG.push({t:now(), who:ME+'（管理员）', seq:'-', id:'-', zh:'批量导入合并',
        field:'导入', from:'', to:`新增 ${add} · 更新 ${upd}${skip?` · 忽略 ${skip}`:''}`});
      save('lg',LOG); render();
      alert(`导入完成\n新增 ${add} 条 · 更新 ${upd} 条${skip?` · 忽略 ${skip} 条（未匹配）`:''}`);
    };
    rd.readAsText(f,'utf-8');
  };
  inp.click();
}

function short(s,n){ return s.length>n?s.slice(0,n)+'…':s; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
